name: Godot syntax and headless smoke check
on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
  workflow_dispatch:
jobs:
  godot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.2.2 headless
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.2.2-stable_linux.x86_64
      - name: Import and parse project
        run: |
          /tmp/Godot_v4.2.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run combat scene briefly
        run: |
          /tmp/Godot_v4.2.2-stable_linux.x86_64 --headless --path . --quit-after 120
