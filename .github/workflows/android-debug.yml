name: CONDENA Android APK (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot Android export templates and debug signing
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless curl unzip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-export
          cp /tmp/godot-export/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
          cp /tmp/godot-export/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=CONDENA,C=CL"
          JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;33.0.2" "platforms;android-33" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -s "$HOME/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk"
          test -s "$HOME/.android/debug.keystore"
          echo "Java SDK: $JAVA_SDK"
          echo "Android SDK: $ANDROID_HOME"
          ls -lh "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
      - name: Godot import
        run: godot --headless --path . --editor --import --quit
      - name: Combat smoke tests
        run: godot --headless --path . --script res://tests/combat_smoke.gd
      - name: Inspect Android export configuration
        run: |
          set -eu
          cat "$HOME/.config/godot/editor_settings-4.tres"
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/platform-tools" || true
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android
          echo "Export preset:"
          cat export_presets.cfg
          echo "Installed Android templates:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.2.2.stable/"
          echo "Android SDK components:"
          find "$ANDROID_HOME" -maxdepth 2 -type d \( -name "android-33" -o -name "33.0.2" -o -name "platform-tools" \) -print
      - name: Diagnose Android export preset
        run: godot --headless --path . --script res://tests/android_export_diagnostics.gd
      - name: Export Android debug
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Debug" build/CONDENA-debug.apk
          test -s build/CONDENA-debug.apk
      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: CONDENA-Android-debug
          path: build/CONDENA-debug.apk
          if-no-files-found: error
          retention-days: 3
